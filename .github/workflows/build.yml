name: Build NTP for Debian

on:
  push:
    branches: [stable]
    tags: ['v*']
  pull_request:
    branches: [stable]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: [bullseye, bookworm, trixie]
    steps:
    - uses: actions/checkout@v4
    - name: Build for Debian ${{ matrix.release }}
      run: make -f packaging.mk build DEBIAN_RELEASE=${{ matrix.release }} OUTPUT_DIR=${{ github.workspace }}/packaging/output/${{ matrix.release }}
    - name: Test installation on ${{ matrix.release }}
      run: make -f packaging.mk test DEBIAN_RELEASE=${{ matrix.release }} OUTPUT_DIR=${{ github.workspace }}/packaging/output/${{ matrix.release }}
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ntp-${{ matrix.release }}
        path: packaging/output/${{ matrix.release }}/*.deb
        retention-days: 3

  release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: ntp-*
        merge-multiple: true
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: '*.deb'
